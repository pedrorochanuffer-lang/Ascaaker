<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Ascaaker: ASCII com IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: monospace; max-width: 600px; margin: 3rem auto; }
    textarea, pre { width: 100%; }
    button { margin-top: 1rem; }
    pre { background: #222; color: #f5f5f5; padding: 1em; overflow-x:auto;}
  </style>
</head>
<body>
  <h1>Ascaaker: ASCII Art IA</h1>
  <textarea id="prompt" rows="3" placeholder="Descreva o desenho em ASCII (ex: 'um gato sorrindo')"></textarea>
  <button id="gerar">Gerar ASCII Art</button>
  <pre id="resultado"></pre>
  <script type="module" src="./../src/main.js"></script>
</body>
</html>
